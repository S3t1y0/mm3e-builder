<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130" width="420" height="130">
  <defs>
    <!-- Comic Superhero Gradient: Yellow -> Amber -> Red -->
    <linearGradient id="mmGradTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff83b"/>
      <stop offset="28%" stop-color="#ffbe0b"/>
      <stop offset="68%" stop-color="#fb5607"/>
      <stop offset="100%" stop-color="#c1121f"/>
    </linearGradient>
    <linearGradient id="mmGradBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffa65"/>
      <stop offset="25%" stop-color="#ffb703"/>
      <stop offset="65%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#b7094c"/>
    </linearGradient>

    <!-- Deep Comic Shadow Filter -->
    <filter id="drop3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <g transform="skewX(-6)" filter="url(#drop3D)">
    <!-- 1. MUTANTS & (Top Line) -->
    <!-- Heavy Black Stroke Outline Layer -->
    <text x="210" y="52" 
          font-family="'Arial Black', Impact, 'Trebuchet MS', sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="0.04em" 
          text-anchor="middle" 
          stroke="#000000" 
          stroke-width="10" 
          stroke-linejoin="round" 
          stroke-linecap="round" 
          fill="#000000">MUTANTS &amp;</text>
    
    <!-- Inner Vibrant Gradient Fill -->
    <text x="210" y="52" 
          font-family="'Arial Black', Impact, 'Trebuchet MS', sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="0.04em" 
          text-anchor="middle" 
          fill="url(#mmGradTop)" 
          stroke="#ffffff" 
          stroke-width="1.2" 
          stroke-linejoin="round">MUTANTS &amp;</text>

    <!-- 2. MASTERMINDS (Bottom Line) -->
    <!-- Heavy Black Stroke Outline Layer -->
    <text x="210" y="108" 
          font-family="'Arial Black', Impact, 'Trebuchet MS', sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="0.03em" 
          text-anchor="middle" 
          stroke="#000000" 
          stroke-width="12" 
          stroke-linejoin="round" 
          stroke-linecap="round" 
          fill="#000000">MASTERMINDS</text>
    
    <!-- Inner Vibrant Gradient Fill -->
    <text x="210" y="108" 
          font-family="'Arial Black', Impact, 'Trebuchet MS', sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="0.03em" 
          text-anchor="middle" 
          fill="url(#mmGradBot)" 
          stroke="#ffffff" 
          stroke-width="1.4" 
          stroke-linejoin="round">MASTERMINDS</text>
  </g>
</svg>
