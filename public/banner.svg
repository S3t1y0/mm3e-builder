<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#006fb8" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#08142b" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#080d1a" stop-opacity="1" />
    </radialGradient>

    <!-- Logo Icon Box Gradients -->
    <linearGradient id="iconBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006fb8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.12" />
    </linearGradient>

    <linearGradient id="iconBoxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#006fb8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Shield Flash Icon Gradient -->
    <linearGradient id="flashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Tactical Grid Pattern -->
    <pattern id="tacticalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.04" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.08" />
    </pattern>

    <!-- Filters -->
    <filter id="boxGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#006fb8" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="12" stdDeviation="32" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#080d1a" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#tacticalGrid)" />

  <!-- Ambient Glowing Concentric Tactical Rings & Hex Reticles (No Text) -->
  <g opacity="0.45">
    <circle cx="600" cy="315" r="180" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="600" cy="315" r="240" fill="none" stroke="#006fb8" stroke-width="1.5" stroke-dasharray="6 12" stroke-opacity="0.35" />
    <circle cx="600" cy="315" r="320" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="16 16" stroke-opacity="0.2" />
    <circle cx="600" cy="315" r="410" fill="none" stroke="#006fb8" stroke-width="1.5" stroke-dasharray="8 24" stroke-opacity="0.22" />
    <circle cx="600" cy="315" r="490" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 32" stroke-opacity="0.15" />
  </g>

  <!-- Tactical Reticle Axis Ticks (No Text) -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <!-- Top & Bottom Axis -->
    <line x1="600" y1="80" x2="600" y2="120" />
    <circle cx="600" cy="72" r="3" fill="#38bdf8" />
    <line x1="600" y1="510" x2="600" y2="550" />
    <circle cx="600" cy="558" r="3" fill="#38bdf8" />

    <!-- Left & Right Axis -->
    <line x1="280" y1="315" x2="320" y2="315" />
    <circle cx="272" cy="315" r="3" fill="#38bdf8" />
    <line x1="880" y1="315" x2="920" y2="315" />
    <circle cx="928" cy="315" r="3" fill="#38bdf8" />
  </g>

  <!-- Corner Tactical Brackets (No Text) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5">
    <!-- Top Left -->
    <path d="M 45 80 L 45 45 L 80 45" />
    <circle cx="45" cy="45" r="3" fill="#38bdf8" />
    <!-- Top Right -->
    <path d="M 1120 45 L 1155 45 L 1155 80" />
    <circle cx="1155" cy="45" r="3" fill="#38bdf8" />
    <!-- Bottom Left -->
    <path d="M 45 550 L 45 585 L 80 585" />
    <circle cx="45" cy="585" r="3" fill="#38bdf8" />
    <!-- Bottom Right -->
    <path d="M 1120 585 L 1155 585 L 1155 550" />
    <circle cx="1155" cy="585" r="3" fill="#38bdf8" />
  </g>

  <!-- CENTERPIECE: The Official App SVG Logo (Shield Flash Icon Box, Centered, No Text) -->
  <g transform="translate(600, 315)" filter="url(#boxGlow)">
    <!-- 1. Outer Box (.logo-icon-box) scaled to 260px × 260px -->
    <rect x="-130" y="-130" width="260" height="260" rx="52" fill="url(#iconBoxBg)" stroke="url(#iconBoxBorder)" stroke-width="3.5" />

    <!-- 2. Inner Subtle Border Accent -->
    <rect x="-118" y="-118" width="236" height="236" rx="42" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <!-- 3. Exact RemixIcon: ri-shield-flash-line (viewBox 0 0 24 24, scaled to 170px centered) -->
    <g transform="translate(-85, -85) scale(7.083)" filter="url(#shieldGlow)">
      <path d="M3.78307 2.82598L12 1L20.2169 2.82598C20.6745 2.92766 21 3.33347 21 3.80217V13.7889C21 15.795 19.9974 17.6684 18.3282 18.7812L12 23L5.6718 18.7812C4.00261 17.6684 3 15.795 3 13.7889V3.80217C3 3.33347 3.32553 2.92766 3.78307 2.82598ZM5 4.60434V13.7889C5 15.1263 5.6684 16.3752 6.7812 17.1171L12 20.5963L17.2188 17.1171C18.3316 16.3752 19 15.1263 19 13.7889V4.60434L12 3.04879L5 4.60434ZM13 10H16L11 17V12H8L13 5V10Z"
            fill="url(#flashGrad)" />
    </g>
  </g>
</svg>
