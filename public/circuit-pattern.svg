<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Cyan Electronic PCB Background -->
  <rect width="360" height="360" fill="#0284c7"/>

  <!-- Subtle Micro-Grid underlay -->
  <g stroke="#0369a1" stroke-width="0.5" opacity="0.35">
    <path d="M 0 30 H 360 M 0 60 H 360 M 0 90 H 360 M 0 120 H 360 M 0 150 H 360 M 0 180 H 360 M 0 210 H 360 M 0 240 H 360 M 0 270 H 360 M 0 300 H 360 M 0 330 H 360"/>
    <path d="M 30 0 V 360 M 60 0 V 360 M 90 0 V 360 M 120 0 V 360 M 150 0 V 360 M 180 0 V 360 M 210 0 V 360 M 240 0 V 360 M 270 0 V 360 M 300 0 V 360 M 330 0 V 360"/>
  </g>

  <!-- Circuit Trace Buses (Cyan Lines with 45-Degree Elbows) -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Trace Set 1: Top Left to Center -->
    <path d="M 0 45 H 55 L 85 75 H 145 L 165 95 V 140 L 180 155 H 230 L 250 175 V 230"/>
    <path d="M 0 75 H 45 L 75 105 H 125"/>
    <path d="M 30 0 V 35 L 55 60 V 120 L 75 140 H 130"/>
    <path d="M 90 0 V 45 L 120 75 V 135 L 140 155 H 195"/>

    <!-- Trace Set 2: Center to Bottom Right -->
    <path d="M 170 360 V 315 L 195 290 H 260 L 285 265 V 195 L 305 175 H 360"/>
    <path d="M 230 360 V 330 L 255 305 H 320 L 340 285 V 240 L 360 220"/>
    <path d="M 125 220 H 165 L 190 245 V 310 L 210 330 H 270 L 300 360"/>
    <path d="M 360 60 H 315 L 285 90 H 220 L 195 115 V 170"/>

    <!-- Trace Set 3: Diagonal Interconnects -->
    <path d="M 360 120 H 330 L 300 150 V 210 L 280 230 H 215 L 195 250 H 140 L 120 270 V 360"/>
    <path d="M 70 360 V 320 L 95 295 H 155 L 175 275 V 225"/>
    <path d="M 0 210 H 45 L 75 240 V 285 L 105 315 H 160"/>
    <path d="M 0 280 H 35 L 60 305 V 345 L 75 360"/>
    <path d="M 270 0 V 35 L 245 60 H 180 L 160 80"/>
  </g>

  <!-- Secondary Fine Traces (Light Cyan) -->
  <g fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M 0 160 H 60 L 80 180 H 130 L 150 160 H 210 L 230 140 H 290 L 310 160 H 360"/>
    <path d="M 140 0 V 50 L 160 70 H 220 L 240 90 V 150 L 260 170 H 320 L 340 190 V 270"/>
    <path d="M 40 190 V 230 L 60 250 H 110 L 130 270 V 330"/>
    <path d="M 320 0 V 40 L 300 60 H 250 L 230 80"/>
  </g>

  <!-- Terminal Contact Solder Pads / Dots (Circular Nodes) -->
  <g fill="#bae6fd" stroke="#0369a1" stroke-width="1.5">
    <circle cx="125" cy="105" r="4.2"/>
    <circle cx="130" cy="140" r="4.2"/>
    <circle cx="195" cy="155" r="4.2"/>
    <circle cx="170" cy="170" r="4.2"/>
    <circle cx="125" cy="220" r="4.2"/>
    <circle cx="175" cy="225" r="4.2"/>
    <circle cx="250" cy="175" r="4.2"/>
    <circle cx="160" cy="80"  r="4.2"/>
    <circle cx="160" cy="315" r="4.2"/>
    <circle cx="230" cy="140" r="4.2"/>
    <circle cx="130" cy="330" r="4.2"/>
    <circle cx="230" cy="80"  r="4.2"/>
    <circle cx="280" cy="230" r="4.2"/>
    <circle cx="160" cy="70"  r="4.2"/>
  </g>

  <!-- Hollow PCB Through-Hole Vias (Ring Vias) -->
  <g fill="#0284c7" stroke="#7dd3fc" stroke-width="2">
    <circle cx="55"  cy="45"  r="3.5"/>
    <circle cx="145" cy="75"  r="3.5"/>
    <circle cx="260" cy="290" r="3.5"/>
    <circle cx="220" cy="90"  r="3.5"/>
    <circle cx="75"  cy="285" r="3.5"/>
    <circle cx="215" cy="230" r="3.5"/>
    <circle cx="250" cy="60"  r="3.5"/>
    <circle cx="95"  cy="295" r="3.5"/>
  </g>

  <!-- Microchip Pin Clusters (IC Footprints) -->
  <g fill="#bae6fd" opacity="0.9">
    <!-- Quad Pin Group 1 -->
    <rect x="180" y="20" width="8" height="2" rx="0.5"/>
    <rect x="180" y="25" width="8" height="2" rx="0.5"/>
    <rect x="180" y="30" width="8" height="2" rx="0.5"/>
    <rect x="180" y="35" width="8" height="2" rx="0.5"/>

    <!-- Quad Pin Group 2 -->
    <rect x="80" y="180" width="2" height="8" rx="0.5"/>
    <rect x="85" y="180" width="2" height="8" rx="0.5"/>
    <rect x="90" y="180" width="2" height="8" rx="0.5"/>
    <rect x="95" y="180" width="2" height="8" rx="0.5"/>

    <!-- Quad Pin Group 3 -->
    <rect x="290" y="310" width="8" height="2" rx="0.5"/>
    <rect x="290" y="315" width="8" height="2" rx="0.5"/>
    <rect x="290" y="320" width="8" height="2" rx="0.5"/>
    <rect x="290" y="325" width="8" height="2" rx="0.5"/>
  </g>
</svg>
